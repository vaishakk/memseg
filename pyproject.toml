[project]
name = "memseg"
version = "0.1.0"
description = "Membrane instance segmentation: turn binary membrane masks into per-membrane label maps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.26.0",
    "pillow>=10.0",
    "tifffile>=2024.1.1",
]

[project.optional-dependencies]
# Planned CryoSPARC integration (not used by the package yet).
cryosparc = [
    "cryosparc-tools>=5.0.3",
    "mrcfile>=1.5.4",
]

[project.urls]
Repository = "https://github.com/vaishakk/memseg"

[project.scripts]
memseg = "memseg.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
